  # =============================================================================
  # OpenClaw, local self-hosted personal-assistant agent (gateway on lo:18789)
  # =============================================================================
  # OpenClaw calls its own LLM inside the Node process, so provider is the
  # no-LLM stub here. The control channel (lo:18789) is shaped + captured via
  # loopback_ports; OpenClaw's LLM/tool egress is shaped by the main interface.
  # Requires: npm install -g openclaw@latest && openclaw onboard --install-daemon
  # The exact gateway route / provider config keys are version dependent, pin
  # gateway_endpoint / drive here once confirmed (see AGENTIC.md "Open items").
  openclaw_personal_assistant:
    type: "openclaw_agent"
    inter_prompt_delay_sec: 0
    description: "Local OpenClaw personal assistant driving deterministic tasks"
    provider: "openclaw"
    model: "openclaw"
    drive: "cli"                  # "cli" runs `openclaw agent ...`; "http" POSTs to the gateway
    cli_bin: "openclaw"
    # -> openclaw agent --json --session-id testbed-<rand> -m "<prompt>" (via the gateway)
    cli_args: ["agent", "--json", "--session-id", "{session}", "-m", "{prompt}"]
    gateway_url: "http://127.0.0.1:18789"
    loopback_ports: [18789]
    task_timeout_sec: 180
    prompts:
      - "List my three most urgent tasks for today and summarize each in one sentence."
      - "Draft a short calendar note reminding me to review the 6G media study contributions tomorrow morning."

  # =============================================================================
  # A2A (Agent2Agent protocol), local reproducible agents on loopback
  # =============================================================================
  # Local A2A agents are launched as subprocesses on fixed loopback ports and
  # shaped/captured like MCP-over-HTTP. No API keys required (deterministic
  # agents). Requires: pip install a2a-sdk.
  a2a_single_task_local:
    type: "a2a_single_task"
    inter_prompt_delay_sec: 0
    description: "A2A non-streaming message/send against a local echo agent"
    provider: "a2a"
    model: "echo"
    streaming: false
    loopback_ports: [9001]
    target_port: 9001
    agents:
      - module: "a2a_agents.echo_agent"
        port: 9001
        args: ["--behavior", "echo", "--stream-chunks", "1"]
    prompts:
      - "Summarize the goals of the 6G media study in one sentence."
      - "What network conditions most affect agent-to-agent traffic?"

  a2a_streaming_local:
    type: "a2a_streaming"
    inter_prompt_delay_sec: 0
    description: "A2A streaming message/stream (SSE) against a local echo agent"
    provider: "a2a"
    model: "echo"
    streaming: true
    loopback_ports: [9001]
    target_port: 9001
    agents:
      - module: "a2a_agents.echo_agent"
        port: 9001
        args: ["--behavior", "echo", "--stream-chunks", "6", "--stream-delay-ms", "40"]
    prompts:
      - "Describe how streaming artifact updates arrive over A2A as a short paragraph of several words."

  a2a_multi_agent_local:
    type: "a2a_multi_agent"
    inter_prompt_delay_sec: 0
    description: "A2A multi-agent delegation: orchestrator fans out to two echo agents"
    provider: "a2a"
    model: "orchestrator"
    streaming: false
    loopback_ports: [9001, 9002, 9003]
    target_port: 9003
    agents:
      - module: "a2a_agents.echo_agent"
        port: 9001
        args: ["--behavior", "echo"]
      - module: "a2a_agents.echo_agent"
        port: 9002
        args: ["--behavior", "upper"]
      - module: "a2a_agents.orchestrator_agent"
        port: 9003
        args: ["--downstream", "http://127.0.0.1:9001,http://127.0.0.1:9002"]
    prompts:
      - "Coordinate a summary of 6G agentic traffic across your downstream agents."

  # Remote A2A variants (opt-in): point at an external A2A agent. Set the
  # A2A_REMOTE_AGENT_URL env var (or a literal agent_card_url). Shaped by the
  # main-interface egress netem; captured by the primary pcap.
  a2a_single_task_remote:
    type: "a2a_single_task"
    inter_prompt_delay_sec: 0
    description: "A2A non-streaming task against a remote/hosted agent"
    provider: "a2a"
    model: "remote"
    streaming: false
    agent_card_url_env: "A2A_REMOTE_AGENT_URL"   # or agent_card_url: "https://..."
    request_timeout_sec: 60                       # cold starts / high-RTT profiles
    # agent_card_path: "/.well-known/agent.json"  # only for agents on the legacy card path
    prompts:
      - "Summarize the goals of the 6G media study in one sentence."

  a2a_streaming_remote:
    type: "a2a_streaming"
    inter_prompt_delay_sec: 0
    description: "A2A streaming task against a remote/hosted agent"
    provider: "a2a"
    model: "remote"
    streaming: true
    agent_card_url_env: "A2A_REMOTE_AGENT_URL"
    prompts:
      - "Describe agent-to-agent streaming traffic in a few words."

# Default experiment settings
defaults:
  runs_per_scenario: 10          # Direct-orchestrator default; run_full_tests.sh overrides globally
  inter_run_delay_sec: 3.0        # Increased from 1.0 to avoid rate limits
  timeout_sec: 180                 # Increased for slow network profiles
  retry_count: 3
  retry_backoff_sec: 5.0          # Increased backoff for rate limit recovery
  retry_backoff_multiplier: 2.0
  stall_gap_sec: 1.0
  burst_gap_sec: 1.0

