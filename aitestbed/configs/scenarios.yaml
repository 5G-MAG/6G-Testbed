    phase: "vllm"
    profiles: *full_suite_profiles
    priority: "high"
    runner_enabled_by_default: true
    prereqs:
      - "http://localhost:8000/v1/models"
      - "examples/assets/test_video.mp4"

  # Encoder placement: server-side vs terminal-side visual encoder,
  # backed by the SGLang engine sidecar (port 8002).
  # Mode switching (env ENC_MODE wins over the `mode` key):
  #   ENC_MODE=server — terminal uploads the original video; the server
  #                     runs decode+processor+ViT+prefill (baseline)
  #   ENC_MODE=edge   — terminal runs decode+processor+ViT, uploads the
  #                     precomputed_embedding bundle; the server injects
  #                     it into prefill directly
  # Run each mode over the same profiles for an A/B comparison; use a
  # different output DB/session per mode because --resume counts runs
  # per scenario+profile regardless of mode.
  - scenario: "encoder_placement"
    phase: "split"
    profiles: *full_suite_profiles
    priority: "high"
    runner_enabled_by_default: true
    prereqs:
      - "http://localhost:8002/v1/models"
      - "examples/assets/dataset_real/sample_1/video.mp4"

  # Qwen3-VL concurrent arm (lock-free sidecar 8012, N barrier-aligned
  # users per wave; dataset mode = N playlists: turn_index =
  # user*1000 + seq in the DB, single-video mode = wave*1000 + user).
  # Same provider as the serial scenario: export
  # SGLANG_ENGINE_BASE_URL=http://localhost:8012 for the orchestrator
  # invocation. Remote sidecar: edit the prereq URL to match.
  - scenario: "encoder_placement_concurrent"
    phase: "split"
    profiles: *full_suite_profiles
    priority: "high"
    runner_enabled_by_default: false
    prereqs:
      - "http://localhost:8012/v1/models"
      - "examples/assets/dataset_real/sample_1/video.mp4"

  # Qwen3.6 sibling (serial sidecar 8004). Same mode-switch semantics
  # as encoder_placement above (env ENC_MODE_QWEN36 wins). Remote
  # sidecar: export SGLANG_ENGINE_QWEN36_BASE_URL before the run and
  # edit the prereq URL to match.
  - scenario: "encoder_placement_qwen36"
    phase: "split"
    profiles: *full_suite_profiles
    priority: "high"
    runner_enabled_by_default: false
    prereqs:
      - "http://localhost:8004/v1/models"
      - "examples/assets/dataset_real/sample_1/video.mp4"

  # Qwen3.6 sibling, concurrent arm (lock-free sidecar 8014, N
  # barrier-aligned users per wave; dataset mode = N playlists:
  # turn_index = user*1000 + seq in the DB, single-video mode =
  # wave*1000 + user). Remote sidecar: export
  # SGLANG_ENGINE_QWEN36_BASE_URL before the run and edit the prereq
  # URL to match.
  - scenario: "encoder_placement_concurrent_qwen36"
    phase: "split"
    profiles: *full_suite_profiles
    priority: "high"
    runner_enabled_by_default: false
    prereqs:
      - "http://localhost:8014/v1/models"
      - "examples/assets/dataset_real/sample_1/video.mp4"
